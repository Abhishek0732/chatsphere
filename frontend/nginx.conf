server {
    listen       80;
    listen  [::]:80;
    # HTTPS with a self-signed cert, so the app is a secure context on the LAN IP
    # (required for microphone access / voice calls over an IP address).
    listen       443 ssl;
    listen  [::]:443 ssl;
    ssl_certificate     /etc/nginx/certs/self.crt;
    ssl_certificate_key /etc/nginx/certs/self.key;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # gzip for text assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Never cache the shell / service worker so updates roll out.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # Long-cache fingerprinted build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy REST API to the backend (same-origin, so it works over localhost,
    # LAN IP, and any public tunnel without CORS or baked-in host issues).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Allow media uploads up to the backend's 25 MB file limit, with a
        # little headroom for multipart overhead. nginx defaults to 1 MB,
        # which would 413 larger uploads before they ever reach Spring.
        client_max_body_size 30m;
        # Stream the upload straight to the backend instead of buffering the
        # whole request body in nginx first — removes a size-proportional stage
        # from the upload path (the file was being staged in nginx AND Spring).
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Proxy uploaded media (images/files) to MinIO, same-origin. The trailing
    # slash strips the "/media/" prefix, so "/media/<bucket>/<object>" maps to
    # "http://minio:9000/<bucket>/<object>". Serving media same-origin means it
    # loads over localhost, a LAN IP, or an HTTPS tunnel with no baked-in host
    # and no mixed-content blocking.
    location /media/ {
        proxy_pass http://minio:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Uploads can be large; don't buffer the whole object in nginx.
        proxy_buffering off;
        client_max_body_size 100m;
    }

    # Proxy the WebSocket/SockJS endpoint with upgrade support.
    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Backend health passthrough (handy for tunnels / uptime checks).
    location /actuator/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
