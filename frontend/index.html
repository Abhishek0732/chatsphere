<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="description" content="ChatSphere - a WhatsApp-style real-time chat app" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>ChatSphere</title>
    <script>
      // Apply the full persisted appearance before first paint to avoid flash.
      (function () {
        try {
          var raw = localStorage.getItem('chatsphere-theme');
          var parsed = raw ? JSON.parse(raw) : {};
          var s = parsed.state || {};
          var ver = parsed.version || 0;
          var el = document.documentElement;
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = s.theme || 'system';
          if (theme === 'dark' || (theme === 'system' && prefersDark)) el.classList.add('dark');
          var oldDefault =
            !s.accent ||
            s.accent === 'violet' ||
            s.accent === 'blurple' ||
            s.accent === 'indigo';
          var acc = s.customAccent ? 'custom' : ver < 3 && oldDefault ? 'whatsapp' : s.accent || 'whatsapp';
          el.setAttribute('data-accent', acc);
          el.setAttribute('data-wallpaper', s.customWallpaper ? 'custom' : s.wallpaper || 'doodle');
          el.setAttribute('data-bg', ver < 3 && oldDefault ? 'minimal' : s.background || 'minimal');
          var fonts = {
            inter: "'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif",
            system: "system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif",
            rounded: "ui-rounded, 'SF Pro Rounded', 'Hiragino Maru Gothic ProN', Nunito, system-ui, sans-serif",
            serif: "ui-serif, Georgia, Cambria, 'Times New Roman', serif",
            mono: "ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace",
          };
          if (s.font && fonts[s.font]) el.style.setProperty('--font-sans', fonts[s.font]);
          var sizes = { sm: '15px', md: '16px', lg: '17.5px', xl: '19px' };
          if (s.textSize && sizes[s.textSize]) el.style.fontSize = sizes[s.textSize];
          var radii = { sharp: ['12px', '10px'], default: ['20px', '14px'], round: ['30px', '18px'] };
          var r = radii[s.radius || 'default'];
          if (r) {
            el.style.setProperty('--radius-panel', r[0]);
            el.style.setProperty('--radius-field', r[1]);
          }
          if (s.customWallpaper) {
            el.style.setProperty('--chat-bg', s.customWallpaper);
            el.style.setProperty('--chat-dot', 'transparent');
            el.style.setProperty('--chat-dot-dark', 'transparent');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
