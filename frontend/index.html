<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="ChatSphere - a WhatsApp-style real-time chat app" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>ChatSphere</title>
    <script>
      // Apply persisted theme before first paint to avoid flash.
      (function () {
        try {
          var raw = localStorage.getItem('chatsphere-theme');
          var state = raw ? JSON.parse(raw).state : {};
          var theme = state.theme || 'system';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = theme === 'dark' || (theme === 'system' && prefersDark);
          if (isDark) document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-accent', state.accent || 'violet');
          document.documentElement.setAttribute('data-wallpaper', state.wallpaper || 'doodle');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
