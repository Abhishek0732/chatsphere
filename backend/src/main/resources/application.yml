spring:
  application:
    name: chatsphere
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/chatsphere?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:chatsphere}
    password: ${SPRING_DATASOURCE_PASSWORD:chatsphere_pw}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # Default is 10 — a hard concurrency ceiling. Size to the DB's capacity;
      # override per instance via env when scaling horizontally.
      # Sized against Tomcat's worker threads: too small and requests queue behind
      # the pool, too large and MySQL is the one that queues. Keep
      # (replicas x pool-size) below the server's max_connections.
      maximum-pool-size: ${DB_POOL_SIZE:50}
      minimum-idle: 10
      connection-timeout: 10000
      # Don't let a leaked connection be held forever.
      max-lifetime: 900000
      leak-detection-threshold: 20000
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
        # Collapse multi-row insert/update loops (group members, notifications,
        # status privacy) into batched round-trips.
        jdbc:
          batch_size: 30
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      # A stalled Redis must fail fast, not hang presence on every heartbeat.
      timeout: 2s
      connect-timeout: 2s
  task:
    scheduling:
      # Ring-timeout timers + the missed-call sweeper share this pool.
      pool:
        size: 4
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: chatsphere
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.chatsphere.*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  mail:
    # Defaults target the bundled Mailpit dev SMTP (no auth). Point these at a
    # real provider (SendGrid/SES/Gmail SMTP) via env in production.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
  servlet:
    multipart:
      # 25MB usable file size; the request cap has headroom for multipart
      # boundary/header overhead so an actual 25MB file isn't rejected.
      max-file-size: 25MB
      max-request-size: 30MB
      # Keep uploads up to this size in memory instead of spilling them to a temp
      # file on disk (the Spring default threshold is 0B = always disk). Client
      # photos are compressed to well under this, so the common path avoids the
      # extra disk write+read entirely; only large videos spill.
      file-size-threshold: 4MB

server:
  port: 8080
  tomcat:
    threads:
      # Worker threads for HTTP. Left at defaults these silently cap throughput.
      max: ${TOMCAT_MAX_THREADS:200}
      min-spare: 20
    # Each WebSocket/SockJS connection holds a connection slot; the default 8192
    # is a hard ceiling on concurrent users per instance.
    max-connections: ${TOMCAT_MAX_CONNECTIONS:20000}
    accept-count: 200
  compression:
    # Conversation lists and message pages are JSON — compressing them is the
    # cheapest latency win available on a mobile network.
    enabled: true
    mime-types: application/json,text/plain,text/css,text/javascript,application/javascript
    min-response-size: 1024

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

chatsphere:
  app:
    # Base URL used to build the password-reset link in emails, and the sender.
    frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
    mail-from: ${APP_MAIL_FROM:ChatSphere <no-reply@chatsphere.local>}
    # Require OTP email verification during signup. Disable for tests/seeding.
    require-email-verification: ${APP_REQUIRE_EMAIL_VERIFICATION:true}
  music:
    # Storefront the status music catalogue searches — decides which songs are
    # "trending" and which regional music (Bollywood/Punjabi/…) is returned.
    country: ${MUSIC_COUNTRY:IN}
  jwt:
    secret: ${CHATSPHERE_JWT_SECRET:change-me-super-secret-key-at-least-256-bits-long-for-hs256-signing!!}
    access-ttl-min: ${CHATSPHERE_JWT_ACCESS_TTL_MIN:30}
    refresh-ttl-days: ${CHATSPHERE_JWT_REFRESH_TTL_DAYS:14}
  cors:
    allowed-origins: ${CHATSPHERE_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  minio:
    endpoint: ${CHATSPHERE_MINIO_ENDPOINT:http://localhost:9000}
    public-endpoint: ${CHATSPHERE_MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
    access-key: ${CHATSPHERE_MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${CHATSPHERE_MINIO_SECRET_KEY:minioadmin}
    bucket: ${CHATSPHERE_MINIO_BUCKET:chatsphere-media}
  kafka:
    topics:
      messages: chatsphere.messages
      presence: chatsphere.presence
      notifications: chatsphere.notifications
  media:
    livekit:
      # ws/wss URL the BROWSER uses to reach the SFU (public host, not the container).
      url: ${LIVEKIT_URL:ws://localhost:7880}
      api-key: ${LIVEKIT_API_KEY:chatsphere}
      # Must be >= 32 chars (HS256). Overridden via env; never commit the real one.
      api-secret: ${LIVEKIT_API_SECRET:dev-livekit-secret-change-me-0123456789}
      token-ttl-seconds: ${LIVEKIT_TOKEN_TTL:3600}
    turn:
      enabled: ${TURN_ENABLED:true}
      host: ${COTURN_HOST:localhost}
      secret: ${COTURN_SECRET:dev-turn-secret-change-me}
      ttl-seconds: ${TURN_TTL:600}
    # Free public TURN relay — the fallback that carries audio across different
    # networks (or through an HTTP-only tunnel) when no direct path exists.
    # Defaults to OpenRelay's free shared credentials; override via env to point
    # at Cloudflare TURN (or any provider) without a rebuild.
    public-turn:
      enabled: ${WEBRTC_TURN_ENABLED:true}
      urls: ${WEBRTC_TURN_URLS:turn:openrelay.metered.ca:80,turn:openrelay.metered.ca:443,turn:openrelay.metered.ca:443?transport=tcp}
      username: ${WEBRTC_TURN_USERNAME:openrelayproject}
      credential: ${WEBRTC_TURN_CREDENTIAL:openrelayproject}

logging:
  level:
    com.chatsphere: INFO
    org.springframework.web.socket: WARN
