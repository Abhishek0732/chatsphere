spring:
  application:
    name: chatsphere
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/chatsphere?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:chatsphere}
    password: ${SPRING_DATASOURCE_PASSWORD:chatsphere_pw}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: chatsphere
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.chatsphere.*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

chatsphere:
  jwt:
    secret: ${CHATSPHERE_JWT_SECRET:change-me-super-secret-key-at-least-256-bits-long-for-hs256-signing!!}
    access-ttl-min: ${CHATSPHERE_JWT_ACCESS_TTL_MIN:30}
    refresh-ttl-days: ${CHATSPHERE_JWT_REFRESH_TTL_DAYS:14}
  cors:
    allowed-origins: ${CHATSPHERE_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  minio:
    endpoint: ${CHATSPHERE_MINIO_ENDPOINT:http://localhost:9000}
    public-endpoint: ${CHATSPHERE_MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
    access-key: ${CHATSPHERE_MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${CHATSPHERE_MINIO_SECRET_KEY:minioadmin}
    bucket: ${CHATSPHERE_MINIO_BUCKET:chatsphere-media}
  kafka:
    topics:
      messages: chatsphere.messages
      presence: chatsphere.presence
      notifications: chatsphere.notifications

logging:
  level:
    com.chatsphere: INFO
    org.springframework.web.socket: WARN
