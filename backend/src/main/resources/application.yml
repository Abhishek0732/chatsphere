spring:
  application:
    name: chatsphere
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/chatsphere?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:chatsphere}
    password: ${SPRING_DATASOURCE_PASSWORD:chatsphere_pw}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # Default is 10 — a hard concurrency ceiling. Size to the DB's capacity;
      # override per instance via env when scaling horizontally.
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
        # Collapse multi-row insert/update loops (group members, notifications,
        # status privacy) into batched round-trips.
        jdbc:
          batch_size: 30
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  task:
    scheduling:
      # Ring-timeout timers + the missed-call sweeper share this pool.
      pool:
        size: 4
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: chatsphere
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.chatsphere.*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  servlet:
    multipart:
      # 25MB usable file size; the request cap has headroom for multipart
      # boundary/header overhead so an actual 25MB file isn't rejected.
      max-file-size: 25MB
      max-request-size: 30MB
      # Keep uploads up to this size in memory instead of spilling them to a temp
      # file on disk (the Spring default threshold is 0B = always disk). Client
      # photos are compressed to well under this, so the common path avoids the
      # extra disk write+read entirely; only large videos spill.
      file-size-threshold: 4MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

chatsphere:
  jwt:
    secret: ${CHATSPHERE_JWT_SECRET:change-me-super-secret-key-at-least-256-bits-long-for-hs256-signing!!}
    access-ttl-min: ${CHATSPHERE_JWT_ACCESS_TTL_MIN:30}
    refresh-ttl-days: ${CHATSPHERE_JWT_REFRESH_TTL_DAYS:14}
  cors:
    allowed-origins: ${CHATSPHERE_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  minio:
    endpoint: ${CHATSPHERE_MINIO_ENDPOINT:http://localhost:9000}
    public-endpoint: ${CHATSPHERE_MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
    access-key: ${CHATSPHERE_MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${CHATSPHERE_MINIO_SECRET_KEY:minioadmin}
    bucket: ${CHATSPHERE_MINIO_BUCKET:chatsphere-media}
  kafka:
    topics:
      messages: chatsphere.messages
      presence: chatsphere.presence
      notifications: chatsphere.notifications
  media:
    livekit:
      # ws/wss URL the BROWSER uses to reach the SFU (public host, not the container).
      url: ${LIVEKIT_URL:ws://localhost:7880}
      api-key: ${LIVEKIT_API_KEY:chatsphere}
      # Must be >= 32 chars (HS256). Overridden via env; never commit the real one.
      api-secret: ${LIVEKIT_API_SECRET:dev-livekit-secret-change-me-0123456789}
      token-ttl-seconds: ${LIVEKIT_TOKEN_TTL:3600}
    turn:
      enabled: ${TURN_ENABLED:true}
      host: ${COTURN_HOST:localhost}
      secret: ${COTURN_SECRET:dev-turn-secret-change-me}
      ttl-seconds: ${TURN_TTL:600}

logging:
  level:
    com.chatsphere: INFO
    org.springframework.web.socket: WARN
