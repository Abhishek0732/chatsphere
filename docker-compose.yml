name: chatsphere

services:
  # ─── Infrastructure ──────────────────────────────────────────────────────
  mysql:
    image: mysql:8.4
    container_name: chatsphere-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [chatsphere]

  redis:
    image: redis:7.4-alpine
    container_name: chatsphere-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [chatsphere]

  kafka:
    image: apache/kafka:3.8.0
    container_name: chatsphere-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks: [chatsphere]

  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    container_name: chatsphere-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio_data:/data
    networks: [chatsphere]

  # Waits for MinIO, then creates the public media bucket and exits.
  minio-init:
    image: minio/mc:RELEASE.2024-09-16T17-43-14Z
    container_name: chatsphere-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; do
        echo 'waiting for minio...'; sleep 2;
      done &&
      mc mb --ignore-existing local/${MINIO_BUCKET} &&
      mc anonymous set download local/${MINIO_BUCKET} &&
      echo 'MinIO bucket ready';
      "
    networks: [chatsphere]

  # ─── Application ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatsphere-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CHATSPHERE_MINIO_ENDPOINT: http://minio:9000
      CHATSPHERE_MINIO_PUBLIC_ENDPOINT: http://${PUBLIC_HOST}:${MINIO_API_PORT}
      CHATSPHERE_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      CHATSPHERE_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      CHATSPHERE_MINIO_BUCKET: ${MINIO_BUCKET}
      CHATSPHERE_JWT_SECRET: ${JWT_SECRET}
      CHATSPHERE_JWT_ACCESS_TTL_MIN: ${JWT_ACCESS_TTL_MIN}
      CHATSPHERE_JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS}
      CHATSPHERE_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      # Media plane: native peer-to-peer WebRTC (no SFU). The backend only hands
      # the browser ICE servers so the two peers can find a path to each other.
      TURN_ENABLED: "true"
      COTURN_HOST: ${PUBLIC_HOST}
      COTURN_SECRET: ${COTURN_SECRET}
      # Free public TURN relay — the fallback that carries audio across different
      # networks (or a tunnel). Defaults to OpenRelay (see application.yml);
      # uncomment to point at Cloudflare TURN or another provider without a rebuild.
      WEBRTC_TURN_ENABLED: "true"
      # WEBRTC_TURN_URLS: "turn:your.turn:3478?transport=udp,turns:your.turn:5349?transport=tcp"
      # WEBRTC_TURN_USERNAME: ""
      # WEBRTC_TURN_CREDENTIAL: ""
    ports:
      - "${BACKEND_PORT}:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks: [chatsphere]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Same-origin: nginx in the frontend container proxies these to the backend.
        # Works over localhost, LAN IP, and any public tunnel with no rebuild.
        VITE_API_BASE_URL: /api
        VITE_WS_URL: /ws
        # Baked into the self-signed cert so https on the LAN IP is covered.
        PUBLIC_HOST: ${PUBLIC_HOST}
    container_name: chatsphere-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT}:80"
      # https (self-signed) — needed for mic access over the LAN IP.
      - "${FRONTEND_HTTPS_PORT:-5443}:443"
    # Reach the host-networked LiveKit SFU (for the same-origin /rtc proxy).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [chatsphere]

  adminer:
    image: adminer:4.8.1
    container_name: chatsphere-adminer
    restart: unless-stopped
    depends_on:
      - mysql
    ports:
      - "${ADMINER_PORT}:8080"
    networks: [chatsphere]

  # ── Media plane ───────────────────────────────────────────────────────────
  # Native peer-to-peer WebRTC — no SFU. Coturn is a TURN/STUN relay for NAT
  # traversal on the LAN; the browser reaches it directly at ${PUBLIC_HOST}. Host
  # networking because relayed media needs real UDP straight to the host. For
  # cross-network calls a publicly-reachable TURN is used instead (see the
  # WEBRTC_TURN_* env on the backend — free OpenRelay by default).
  coturn:
    image: coturn/coturn:4.6
    container_name: chatsphere-coturn
    restart: unless-stopped
    network_mode: host
    command: >
      -n --realm=chatsphere --use-auth-secret
      --static-auth-secret=${COTURN_SECRET}
      --listening-port=3478 --min-port=49160 --max-port=49200
      --no-tls --no-dtls --log-file=stdout

volumes:
  mysql_data:
  redis_data:
  minio_data:

networks:
  chatsphere:
    driver: bridge
